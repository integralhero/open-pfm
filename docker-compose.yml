services:
  pfm-mcp:
    build: .
    ports:
      - "${MCP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # Auth: set GOOGLE_SERVICE_ACCOUNT_JSON_B64 in .env for remote,
      # or mount a service account key with the volume below for local Docker
    volumes:
      - ./secrets/service-account.json:/app/credentials.json:ro  # only needed if using file-based auth
    restart: unless-stopped
