version: 2.1

orbs:
  python: circleci/python@4.0.0

jobs:
  test:
    executor:
      name: python/default
      tag: "3.13"
    steps:
      - checkout
      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run:
          name: Install dependencies
          command: uv sync --frozen
      - run:
          name: Run tests
          command: uv run pytest tests/ -v --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install Railway CLI
          command: curl -fsSL https://railway.com/install.sh | sh
      - run:
          name: Deploy to Railway
          command: railway up --service "$RAILWAY_SERVICE_ID" --detach

workflows:
  test-and-deploy:
    jobs:
      - test
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main
